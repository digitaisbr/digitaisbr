services:
  db:
    image: postgres:16-alpine
    container_name: digitaisbr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: digitaisbr
      POSTGRES_PASSWORD: digitaisbr
      POSTGRES_DB: digitaisbr
    ports:
      - "5434:5432"
    volumes:
      - digitaisbr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitaisbr -d digitaisbr"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: digitaisbr-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  digitaisbr-pgdata:
