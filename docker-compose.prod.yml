# ============================================================================
#  DigitaisBR — produção
#
#  Uso:
#    cp .env.production.example .env.production
#    # edite .env.production com segredos reais
#    docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# ============================================================================

services:
  # ---- proxy de borda: TLS automático e roteamento -------------------------
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificados — perder isto refaz o TLS do zero
      - caddy-config:/config
    environment:
      DOMINIO: ${DOMINIO}
      # domínio secundário, que apenas redireciona para o oficial
      DOMINIO_ALT: ${DOMINIO_ALT}
      EMAIL_TLS: ${EMAIL_TLS}
    depends_on:
      - web
      - api

  # ---- front estático ------------------------------------------------------
  web:
    build:
      context: ./apps/web
      args:
        # VITE_DEMO=1 publica os atalhos das contas do seed na tela de login.
        # Vazio (o padrão) mantém o bundle limpo.
        VITE_DEMO: ${VITE_DEMO:-}
    restart: unless-stopped
    expose:
      - "80"

  # ---- API -----------------------------------------------------------------
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      # connection_limit deve acompanhar o número de workers/instâncias
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=20
      CORS_ORIGINS: https://www.${DOMINIO},https://${DOMINIO}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ACCESS_CODE: ${ACCESS_CODE}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
    depends_on:
      db:
        condition: service_healthy

  # ---- banco ---------------------------------------------------------------
  #  Em produção séria, prefira o PostgreSQL gerenciado da DigitalOcean:
  #  ele traz backup automático, réplica e atualização de versão.
  #  Nesse caso, remova este serviço e aponte DATABASE_URL para o cluster.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # sem `ports`: o banco só é acessível pela rede interna do compose

volumes:
  pgdata:
  caddy-data:
  caddy-config:
